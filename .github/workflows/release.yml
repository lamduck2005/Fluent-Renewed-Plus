name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of this release (e.g. v1.0)'
        required: true
        default: '1.0'
      summary:
        description: 'Summary of this release'
        required: true
        default: 'Initial release'
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
            CLEAN="${RAW#v}"
            TAG="v${CLEAN// /-}"
            TITLE="${RAW}"
            NOTES="${{ github.event.inputs.summary }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="${TAG}"
            NOTES="Release ${TAG}"
          fi
          gh release create "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest || gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest

  build-script:
    name: Bundle and Upload Fluent Renewed
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup RoKit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install Necessary Tools
        run: |
          rokit trust rojo-rbx/rojo
          rokit trust lune-org/lune
          rokit trust seaofvoices/darklua
          rokit trust UpliftGames/wally
          rokit trust JohnnyMorganz/wally-package-types
          rokit install

      - name: Build
        run: lune run Build bundle header=Lune/Build/Header.luau minify=true ci-mode=true

      - name: Upload Minified Fluent Renewed to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fluent.luau
          path: Distribution/Fluent.luau
      
      - name: Upload Minified Fluent Renewed to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $verInput = "${{ github.event.inputs.version }}"
          if ($verInput) {
            $clean = $verInput -replace "^v", ""
            $tag = "v" + ($clean -replace " ", "-")
          } else {
            $tag = "${{ github.ref_name }}"
          }
          gh release upload "$tag" "Distribution/Fluent.luau" --clobber
        shell: pwsh
      
      - name: Upload Fluent Renewed Model to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $verInput = "${{ github.event.inputs.version }}"
          if ($verInput) {
            $clean = $verInput -replace "^v", ""
            $tag = "v" + ($clean -replace " ", "-")
          } else {
            $tag = "${{ github.ref_name }}"
          }
          gh release upload "$tag" "Distribution/Fluent.rbxm" --clobber
        shell: pwsh

      - name: Upload Fluent Renewed Model to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fluent.rbxm
          path: Distribution/Fluent.rbxm